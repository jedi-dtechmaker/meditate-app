name: Check Android app and API
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meditate_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check database ownership and sync
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d meditate_test -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql -f supabase/migrations/202611170001_accounts_and_sync.sql -f tests/database.test.sql
      - run: npm run bundle:android
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
